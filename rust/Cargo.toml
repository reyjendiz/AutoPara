[workspace]
resolver = "2"
members = [
    "crates/autopara-core",
    "crates/lecture-assist",
    "crates/autopara-app/src-tauri",
    "xtask",
]

# The one place the version lives. Every crate inherits it, and the Tauri app reads it from its
# own crate, so the installer, the updater and the window all report the same number.
[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
autopara-core = { path = "crates/autopara-core" }
caseless = "0.2.2"
chrono-tz = "0.10.4"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
proptest = "1.12.0"
quick-xml = "0.42.0"
regex = "1.13.1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }
unicode-normalization = "0.1.26"
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ts-rs = "12.0.1"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-build = { version = "2.7.4", features = [] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
strip = true
