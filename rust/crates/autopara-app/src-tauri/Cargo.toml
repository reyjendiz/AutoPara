[package]
name = "autopara-app"
description = "AutoPara desktop app: opens each class's meeting link a minute before it starts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "autopara"

[lib]
name = "autopara_app"

[[bin]]
name = "autopara"
path = "src/main.rs"

[features]
# GPU speech recognition; see DECISIONS.md, "GPU builds on Windows".
cuda = ["lecture-assist/cuda"]
vulkan = ["lecture-assist/vulkan"]
metal = ["lecture-assist/metal"]

[build-dependencies]
serde_json.workspace = true
tauri-build.workspace = true

[dependencies]
autopara-core.workspace = true
chrono.workspace = true
keyring.workspace = true
lecture-assist.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-window-state.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
ts-rs.workspace = true

[target.'cfg(windows)'.dependencies]
windows-registry.workspace = true

[lints]
workspace = true
