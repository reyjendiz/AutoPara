[package]
name = "lecture-assist"
description = "Opt-in study aid: local transcription and notes for the class on screen."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["whisper"]
whisper = ["dep:whisper-rs"]
cuda = ["whisper", "whisper-rs/cuda"]
metal = ["whisper", "whisper-rs/metal"]

[dependencies]
cpal = "0.18.2"
futures-util = "0.3.34"
hound = "3.5.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "json", "system-proxy", "http2"] }
rubato = "5.0.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "process"] }
tracing.workspace = true
ts-rs.workspace = true
whisper-rs = { version = "0.16.0", optional = true }

# Unpacks the built-in model's runtime (llm/local.rs); hears only AutoPara's own sound (audio/app.rs).
[target.'cfg(windows)'.dependencies]
wasapi = "0.26.0"
zip.workspace = true

# Audio-only ScreenCaptureKit stream (macOS 13+); see audio/macos.rs.
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11.1.1", features = ["macos_13_0"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
wiremock = "0.6.5"

[lints]
workspace = true
